<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Overload">
<title>Overload Tracker</title>
<style>
:root{
  --bg:#0f1115;--card:#181b22;--card2:#20242d;--line:#2a2f3a;--text:#eef0f4;--mute:#8b93a3;
  --acc:#c6f24e;--accInk:#15180d;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.94);backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:baseline}
h1{font-size:20px;margin:0;letter-spacing:-.3px}
h1 span{color:var(--acc)}
.sub{color:var(--mute);font-size:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px}
.chip.on{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.chip .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-left:5px;vertical-align:middle}
main{padding:12px 16px calc(90px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.dayhead{margin:6px 0 12px}
.dayhead b{font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card.done{border-color:rgba(74,222,128,.45)}
.card.miss{border-color:rgba(248,113,113,.45)}
.exhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exname{font-weight:700}
.scheme{color:var(--mute);font-size:12px;margin-top:2px}
.tgt{text-align:right;flex:0 0 auto}
.tgt .v{font-weight:800;font-size:17px;color:var(--acc)}
.tgt .l{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;margin-top:4px}
.tag.rep{background:rgba(251,191,36,.15);color:var(--warn)}
.tag.up{background:rgba(198,242,78,.14);color:var(--acc)}
.sets{margin-top:10px;display:grid;gap:6px}
.set{display:grid;grid-template-columns:44px 1fr 18px 1fr;gap:6px;align-items:center}
.set .n{color:var(--mute);font-size:12px;font-weight:600}
.set .x{color:var(--mute);text-align:center}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;font-size:16px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
input::placeholder,textarea::placeholder{color:#5d6576}
.status{margin-top:10px;font-size:13px;font-weight:600}
.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}.status.mute{color:var(--mute);font-weight:500}
label.row{display:flex;gap:10px;align-items:center;margin-top:8px;color:var(--text)}
label.row input{width:auto;transform:scale(1.3)}
.field{margin-top:10px}
.field .l{display:block;color:var(--mute);font-size:12px;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(15,17,21,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mute);font-size:12px;font-weight:600;padding:8px 0;border-radius:10px}
nav button .i{display:block;font-size:19px;margin-bottom:2px}
nav button.on{color:var(--acc)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:12px;font-weight:700;font-size:15px;background:var(--acc);color:var(--accInk);margin-top:10px}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(248,113,113,.4)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat .v{font-size:22px;font-weight:800}
.stat .l{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.4px}
.prog{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin-top:8px}
.cell{background:var(--card2);border-radius:6px;padding:5px 0;text-align:center;font-size:11px;font-weight:700;min-height:38px}
.cell small{display:block;color:var(--mute);font-weight:600;font-size:9px}
.cell.ok{background:rgba(74,222,128,.16);color:var(--ok)}
.cell.bad{background:rgba(248,113,113,.16);color:var(--bad)}
.cell.cur{outline:1px solid var(--acc)}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);margin:18px 0 8px;font-weight:700}
.note{color:var(--mute);font-size:13px}
.startrow{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.startrow:last-child{border-bottom:0}
.startrow input{padding:8px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--acc);color:var(--accInk);padding:8px 14px;border-radius:999px;font-weight:700;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Overload<span>.</span></h1>
    <div class="sub" id="subline"></div>
  </div>
  <div class="chips" id="weeks"></div>
</header>
<main id="app"></main>
<nav id="nav">
  <button data-tab="train"><span class="i">🏋️</span>Train</button>
  <button data-tab="progress"><span class="i">📈</span>Progress</button>
  <button data-tab="log"><span class="i">📝</span>Weekly Log</button>
  <button data-tab="settings"><span class="i">⚙️</span>Settings</button>
</nav>
<div class="toast" id="toast"></div>

<script>
/* ---------- PROGRAM (from 8-Week Progressive Overload Plan) ---------- */
// type: load (progresses by inc), base ("Baseline +X lb"), fixed (inc 0), total (push-ups), free (abs), cardio
// u: 'ea' = per dumbbell, 'add' = added weight, '' = stack/machine
const WEEKS=[2,3,4,5,6,7,8,9];
const DAYS=[
 {id:'mon',label:'Mon',title:'Upper A',sub:'Chest + Width',ex:[
  {id:'m_incdb',n:'Incline DB Press',s:3,r:[6,10],start:80,inc:5,u:'ea'},
  {id:'m_pull',n:'Weighted Pull-Ups',s:3,r:[6,10],start:25,inc:5,u:'add'},
  {id:'m_flat',n:'Flat DB / Machine Chest Press',s:2,r:[8,12],start:70,inc:5},
  {id:'m_lat',n:'Cable Lateral Raises',s:3,r:[12,20],start:16.5,inc:0},
  {id:'m_rdf',n:'Rear Delt Fly',s:3,r:[12,20],start:110,inc:5},
  {id:'m_curl',n:'Incline DB Curls',s:2,r:[8,12],start:35,inc:5,u:'ea'},
  {id:'m_tri',n:'Cable Tricep Pushdowns',s:2,r:[8,12],start:66,inc:5},
  {id:'m_pu',n:'Push-Ups Finisher',type:'total',goal:100}
 ]},
 {id:'tue',label:'Tue',title:'Lower A',sub:'Strength',ex:[
  {id:'t_hack',n:'Hack / Trap-Bar Squat',s:3,r:[6,10],start:0,inc:5,base:'3×45 + 25/side'},
  {id:'t_rdl',n:'RDL',s:3,r:[6,10],start:0,inc:5,base:'2×45 + 25/side'},
  {id:'t_lunge',n:'Lunges w/ Vest',s:3,r:[8,12],start:15,inc:0,u:'vest',perLeg:true},
  {id:'t_curl',n:'Leg Curl',s:2,r:[10,15],start:null,inc:5},
  {id:'t_calf',n:'Calf Raises',s:3,r:[10,15],start:0,inc:5,base:'3×45 plates'}
 ]},
 {id:'wed',label:'Wed',title:'Recovery',sub:'Zone 2 + mobility',cardio:true},
 {id:'thu',label:'Thu',title:'Upper B',sub:'3D / V-Taper',ex:[
  {id:'h_lpd',n:'Lat Pulldown',s:3,r:[8,12],start:165,inc:5},
  {id:'h_row',n:'Single-Arm Cable / DB Row',s:3,r:[8,12],start:0,inc:5,base:'2×45 plates'},
  {id:'h_inc',n:'Incline Machine / DB Press',s:3,r:[8,12],start:0,inc:5,base:'2×45 plates'},
  {id:'h_lat',n:'Cable Lateral Raises',s:3,r:[12,20],start:16.5,inc:0},
  {id:'h_rdf',n:'Rear Delt Cable Fly',s:3,r:[12,20],start:110,inc:5},
  {id:'h_ham',n:'Hammer Curls',s:2,r:[8,15],start:45,inc:5,u:'ea'},
  {id:'h_tri',n:'Tricep Pushdowns',s:3,r:[8,15],start:49.5,inc:5}
 ]},
 {id:'fri',label:'Fri',title:'Lower B',sub:'Hypertrophy',ex:[
  {id:'f_lp',n:'Leg Press',s:3,r:[8,12],start:0,inc:5,base:'3×45 + 10/side'},
  {id:'f_wl',n:'Walking Lunges',s:2,r:[10,12],start:40,inc:5,u:'ea',perLeg:true},
  {id:'f_slc',n:'Seated Leg Curl',s:3,r:[8,12],start:120,inc:5},
  {id:'f_ext',n:'Leg Extension',s:2,r:[12,15],start:140,inc:5},
  {id:'f_calf',n:'Calf Raises',s:3,r:[12,15],start:0,inc:5,base:'3×45 plates'},
  {id:'f_abs',n:'Abs',s:4,r:[0,0],type:'free'}
 ]}
];
const ALL=DAYS.flatMap(d=>(d.ex||[]).map(e=>({...e,day:d.id})));
const EX=Object.fromEntries(ALL.map(e=>[e.id,e]));

/* ---------- STATE ---------- */
const KEY='overload-tracker-v1';
function todayDay(){const m={1:'mon',2:'tue',3:'wed',4:'thu',5:'fri'};return m[new Date().getDay()]||'mon'}
let S={logs:{},weeks:{},starts:{},cardio:{},dayNotes:{},ui:{week:2,day:todayDay(),tab:'train'}};
try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);S={...S,...d,ui:{...S.ui,...(d.ui||{}),day:todayDay()}}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const lk=(w,id)=>`w${w}|${id}`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>v===''||v==null||isNaN(+v)?null:+v;

/* ---------- PROGRESSION ENGINE ---------- */
// Rule: attempt +inc each week. If you hit min reps on every set at the target, next week goes up.
// If you fall short, repeat that load next week. Unlogged weeks follow the plan.
function startOf(e){const o=S.starts[e.id];return o!=null&&o!==''?+o:e.start}
function evalLog(e,w,target){
  const L=S.logs[lk(w,e.id)];if(!L||!L.sets)return null;
  const sets=[];for(let i=0;i<e.s;i++)sets.push(L.sets[i]||{});
  const anyW=sets.map(x=>num(x.w)).filter(v=>v!=null);
  const top=anyW.length?Math.max(...anyW):(target??null);
  if(sets.some(x=>num(x.r)==null))return{complete:false,top};
  const ok=sets.every(x=>{const wt=num(x.w)??target;return num(x.r)>=e.r[0]&&(target==null||wt==null||wt>=target)});
  return{complete:true,ok,top};
}
function target(e,wi){
  if(e.type)return null;
  if(wi===0)return startOf(e);
  const pt=target(e,wi-1),ev=evalLog(e,WEEKS[wi-1],pt);
  if(!e.inc)return pt;
  if(!ev||!ev.complete){ if(pt==null) return ev&&ev.top!=null?ev.top:null; return pt+e.inc; }
  if(pt==null)return ev.top==null?null:(ev.ok?ev.top+e.inc:ev.top);
  const base=Math.max(pt,ev.top??pt);
  return ev.ok?base+e.inc:pt;
}
function planned(e,wi){const s=startOf(e);return s==null?null:s+(e.inc||0)*wi}
function fmt(e,v){
  if(v==null)return 'Record load';
  if(e.base!=null)return v===0?e.base:`Base +${v}`;
  if(e.u==='ea')return `${v}s`;
  if(e.u==='add')return `+${v}`;
  if(e.u==='vest')return `${v}-lb vest`;
  return `${v}`;
}
const wIndex=()=>WEEKS.indexOf(S.ui.week);

/* ---------- RENDER ---------- */
const $=s=>document.querySelector(s);
function dayComplete(w,d){
  if(d.cardio){const c=S.cardio[`w${w}`];return !!(c&&num(c.min))}
  return d.ex.every(e=>{
    if(e.type==='total')return num((S.logs[lk(w,e.id)]||{}).total)!=null;
    const L=S.logs[lk(w,e.id)];if(!L||!L.sets)return false;
    for(let i=0;i<e.s;i++){if(num((L.sets[i]||{}).r)==null)return false}return true;
  });
}
function weekComplete(w){return DAYS.filter(d=>!d.cardio).every(d=>dayComplete(w,d))}

function renderHeader(){
  $('#weeks').innerHTML=WEEKS.map(w=>`<button class="chip ${w===S.ui.week?'on':''}" data-week="${w}">W${w}${weekComplete(w)?'<span class="dot"></span>':''}</button>`).join('');
  const d=DAYS.find(x=>x.id===S.ui.day);
  $('#subline').textContent=S.ui.tab==='train'?`Week ${S.ui.week} · ${d.label}`:`Week ${S.ui.week}`;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.ui.tab));
}

function statusHTML(e,w,t){
  if(e.type==='free')return '';
  if(e.type==='total'){const v=num((S.logs[lk(w,e.id)]||{}).total);if(v==null)return `<div class="status mute">Goal: ${e.goal} total</div>`;return v>=e.goal?`<div class="status ok">✓ ${v} done</div>`:`<div class="status bad">${v} / ${e.goal}</div>`}
  const ev=evalLog(e,w,t);
  if(!ev||!ev.complete)return `<div class="status mute">Log reps for all ${e.s} sets · min ${e.r[0]} reps</div>`;
  if(!e.inc)return ev.ok?`<div class="status ok">✓ Hit — load stays fixed</div>`:`<div class="status bad">Below ${e.r[0]} reps on a set</div>`;
  if(ev.ok)return `<div class="status ok">✓ Hit — next week: ${fmt(e,Math.max(t??0,ev.top??0)+e.inc)}</div>`;
  return `<div class="status bad">Missed min reps — repeat ${fmt(e,t)} next week</div>`;
}
function cardClass(e,w,t){
  if(e.type==='total'){const v=num((S.logs[lk(w,e.id)]||{}).total);return v==null?'':v>=e.goal?'done':'miss'}
  if(e.type==='free')return '';
  const ev=evalLog(e,w,t);if(!ev||!ev.complete)return '';return ev.ok?'done':'miss';
}

function exCard(e){
  const w=S.ui.week,wi=wIndex(),k=lk(w,e.id),L=S.logs[k]||{};
  if(e.type==='total'){
    return `<div class="card ${cardClass(e,w)}" id="c_${e.id}"><div class="exhead"><div><div class="exname">${e.n}</div><div class="scheme">${e.goal} total reps</div></div><div class="tgt"><div class="l">Target</div><div class="v">${e.goal}</div></div></div>
    <div class="field"><input inputmode="numeric" placeholder="Total reps done" data-k="${k}" data-f="total" value="${esc(L.total)}"></div><div id="s_${e.id}">${statusHTML(e,w)}</div></div>`;
  }
  const t=target(e,wi),p=planned(e,wi);
  let tag='';
  if(e.inc&&t!=null&&p!=null&&wi>0){ if(t<p)tag=`<span class="tag rep">Adjusted · plan ${fmt(e,p)}</span>`; else if(t>p)tag=`<span class="tag up">Ahead of plan</span>`; }
  const scheme=e.type==='free'?`${e.s} sets · progress reps/load`:`${e.s}×${e.r[0]}–${e.r[1]}${e.perLeg?' / leg':''}${e.u==='ea'?' · per DB':''}`;
  let rows='';
  for(let i=0;i<e.s;i++){
    const st=(L.sets||[])[i]||{};
    rows+=`<div class="set"><span class="n">Set ${i+1}</span>
      <input inputmode="decimal" placeholder="${e.type==='free'?'Load':esc(e.base!=null?(t==null?'+lb':'+'+t):(t??'lb'))}" data-k="${k}" data-i="${i}" data-f="w" value="${esc(st.w)}">
      <span class="x">×</span>
      <input inputmode="numeric" placeholder="${e.type==='free'?'Reps':e.r[0]+'–'+e.r[1]}" data-k="${k}" data-i="${i}" data-f="r" value="${esc(st.r)}"></div>`;
  }
  return `<div class="card ${cardClass(e,w,t)}" id="c_${e.id}">
    <div class="exhead"><div><div class="exname">${e.n}</div><div class="scheme">${scheme}</div>${tag}</div>
    ${e.type==='free'?'':`<div class="tgt"><div class="l">Target</div><div class="v">${esc(fmt(e,t))}</div></div>`}</div>
    ${e.base!=null?`<div class="note" style="margin-top:6px">Weight box = lb added over baseline (${esc(e.base)})</div>`:''}
    <div class="sets">${rows}</div><div id="s_${e.id}">${statusHTML(e,w,t)}</div></div>`;
}

function renderTrain(){
  const w=S.ui.week,d=DAYS.find(x=>x.id===S.ui.day);
  let h=`<div class="chips" style="padding-top:0">${DAYS.map(x=>`<button class="chip ${x.id===d.id?'on':''}" data-day="${x.id}">${x.label}${dayComplete(w,x)?'<span class="dot"></span>':''}</button>`).join('')}</div>
  <div class="dayhead"><b>${d.title}</b> <span class="note">· ${d.sub}</span></div>`;
  if(d.cardio){
    const c=S.cardio[`w${w}`]||{};
    h+=`<div class="card ${num(c.min)?'done':''}"><div class="exname">Zone 2 Incline Walk</div><div class="scheme">30–40 min · keep it restorative</div>
      <div class="grid2 field"><div><span class="l">Minutes</span><input inputmode="numeric" data-c="min" value="${esc(c.min)}" placeholder="30–40"></div>
      <div><span class="l">Incline / speed</span><input data-c="set" value="${esc(c.set)}" placeholder="e.g. 12% · 3.2"></div></div>
      <label class="row"><input type="checkbox" data-c="mob" ${c.mob?'checked':''}> Mobility done</label></div>`;
  } else h+=d.ex.map(exCard).join('');
  const nk=`w${w}|${d.id}`;
  h+=`<div class="field"><span class="l">Session notes</span><textarea rows="3" data-note="${nk}" placeholder="Machine settings, how it felt, substitutions…">${esc(S.dayNotes[nk])}</textarea></div>`;
  $('#app').innerHTML=h;
}

function renderProgress(){
  const wi=wIndex();
  let sessions=0,hits=0,tries=0;
  WEEKS.forEach(w=>DAYS.forEach(d=>{if(!d.cardio&&dayComplete(w,d))sessions++}));
  ALL.filter(e=>e.inc).forEach(e=>WEEKS.forEach((w,i)=>{const ev=evalLog(e,w,target(e,i));if(ev&&ev.complete){tries++;if(ev.ok)hits++}}));
  let h=`<div class="stats"><div class="stat"><div class="v">${sessions}<span class="note">/32</span></div><div class="l">Lifts done</div></div>
    <div class="stat"><div class="v">${tries?Math.round(hits/tries*100):0}%</div><div class="l">Hit rate</div></div>
    <div class="stat"><div class="v">${WEEKS.filter(weekComplete).length}<span class="note">/8</span></div><div class="l">Full weeks</div></div></div>
    <div class="note">Each row shows the top load you logged per week. Green = hit min reps, red = repeat.</div>`;
  DAYS.filter(d=>!d.cardio).forEach(d=>{
    h+=`<div class="sec">${d.label} · ${d.title}</div>`;
    d.ex.filter(e=>e.inc).forEach(e=>{
      const cells=WEEKS.map((w,i)=>{const t=target(e,i),ev=evalLog(e,w,t);
        const cls=ev&&ev.complete?(ev.ok?'ok':'bad'):'';
        const val=ev&&ev.top!=null?(e.base!=null?'+'+ev.top:ev.top):'–';
        return `<div class="cell ${cls} ${i===wi?'cur':''}"><small>W${w}</small>${val}</div>`}).join('');
      const t=target(e,wi),s=startOf(e);
      const gain=(()=>{let best=null;WEEKS.forEach((w,i)=>{const ev=evalLog(e,w,target(e,i));if(ev&&ev.complete&&ev.ok&&ev.top!=null)best=Math.max(best??-1e9,ev.top)});return best!=null&&s!=null?best-s:null})();
      h+=`<div class="card"><div class="exhead"><div class="exname">${e.n}</div><div class="tgt"><div class="l">W${S.ui.week} target</div><div class="v" style="font-size:14px">${esc(fmt(e,t))}</div></div></div>
        ${gain!=null?`<div class="note">Best hit: +${gain} lb over start</div>`:''}<div class="prog">${cells}</div></div>`;
    });
  });
  const bws=WEEKS.map(w=>({w,v:num((S.weeks[`w${w}`]||{}).bw)})).filter(x=>x.v!=null);
  if(bws.length){h+=`<div class="sec">Bodyweight</div><div class="card"><div class="prog">${WEEKS.map(w=>{const v=num((S.weeks[`w${w}`]||{}).bw);return `<div class="cell"><small>W${w}</small>${v??'–'}</div>`}).join('')}</div></div>`}
  $('#app').innerHTML=h;
}

function renderLog(){
  const k=`w${S.ui.week}`,L=S.weeks[k]||{};
  let h=`<div class="dayhead"><b>Week ${S.ui.week}</b> <span class="note">· body & energy</span></div>
  <div class="card"><div class="grid2"><div><span class="l note">Bodyweight</span><input inputmode="decimal" data-wk="bw" value="${esc(L.bw)}" placeholder="lb"></div>
  <div><span class="l note">Energy</span><select data-wk="energy"><option value="">–</option>${[1,2,3,4,5].map(n=>`<option ${String(L.energy)===String(n)?'selected':''}>${n}</option>`).join('')}</select></div></div>
  <div class="grid2 field"><div><span class="l">Sleep avg (hrs)</span><input inputmode="decimal" data-wk="sleep" value="${esc(L.sleep)}"></div>
  <div><span class="l">Soreness (1–5)</span><select data-wk="sore"><option value="">–</option>${[1,2,3,4,5].map(n=>`<option ${String(L.sore)===String(n)?'selected':''}>${n}</option>`).join('')}</select></div></div>
  <div class="field"><span class="l">Notes</span><textarea rows="4" data-wk="notes" placeholder="How the week went, subs, equipment differences…">${esc(L.notes)}</textarea></div></div>
  <div class="sec">Week at a glance</div><div class="card">${DAYS.map(d=>`<div class="startrow"><span>${d.label} · ${d.title}</span><span style="text-align:right;color:${dayComplete(S.ui.week,d)?'var(--ok)':'var(--mute)'}">${dayComplete(S.ui.week,d)?'✓ Done':'—'}</span></div>`).join('')}</div>`;
  $('#app').innerHTML=h;
}

function renderSettings(){
  let h=`<div class="sec">Backup</div><div class="card"><div class="note">Data is saved on this phone's browser. Export a backup now and then so you never lose it.</div>
  <button class="btn" id="exp">Export backup (.json)</button>
  <button class="btn ghost" id="impBtn">Import backup</button><input type="file" id="imp" accept="application/json,.json" hidden></div>
  <div class="sec">Starting loads (Week 2)</div><div class="card"><div class="note" style="margin-bottom:6px">Change these if a machine reads differently at your gym. Baseline lifts use "+lb over baseline", so leave them at 0.</div>
  ${ALL.filter(e=>!e.type).map(e=>`<div class="startrow"><span>${e.n} <span class="note">· ${e.day.toUpperCase()}</span></span><input inputmode="decimal" data-start="${e.id}" value="${esc(S.starts[e.id]??'')}" placeholder="${e.start??'record'}"></div>`).join('')}</div>
  <div class="sec">Reset</div><div class="card"><button class="btn danger" id="reset">Erase all data</button></div>
  <p class="note" style="text-align:center;margin-top:16px">Progression: +5 lb when every set hits the minimum reps. Miss → repeat the load next week.</p>`;
  $('#app').innerHTML=h;
}

function render(){renderHeader();({train:renderTrain,progress:renderProgress,log:renderLog,settings:renderSettings})[S.ui.tab]();}
function refreshCard(id){
  const e=EX[id];if(!e)return;const w=S.ui.week,t=target(e,wIndex());
  const c=document.getElementById('c_'+id),s=document.getElementById('s_'+id);
  if(c){c.classList.remove('done','miss');const cl=cardClass(e,w,t);if(cl)c.classList.add(cl)}
  if(s)s.innerHTML=statusHTML(e,w,t);
  renderHeader();
  document.querySelectorAll('[data-day]').forEach(b=>{const d=DAYS.find(x=>x.id===b.dataset.day);b.innerHTML=d.label+(dayComplete(w,d)?'<span class="dot"></span>':'')});
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1600)}

/* ---------- EVENTS ---------- */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.week){S.ui.week=+b.dataset.week;save();render();return}
  if(b.dataset.day){S.ui.day=b.dataset.day;save();render();window.scrollTo(0,0);return}
  if(b.dataset.tab){S.ui.tab=b.dataset.tab;save();render();window.scrollTo(0,0);return}
  if(b.id==='exp'){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`overload-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();toast('Backup exported');return}
  if(b.id==='impBtn'){$('#imp').click();return}
  if(b.id==='reset'){if(confirm('Erase every logged set, note and setting?')){const ui=S.ui;S={logs:{},weeks:{},starts:{},cardio:{},dayNotes:{},ui};save();render();toast('Reset')}}
});
document.addEventListener('input',ev=>{
  const el=ev.target,d=el.dataset;
  if(d.k){const L=S.logs[d.k]||(S.logs[d.k]={});
    if(d.f==='total')L.total=el.value; else {L.sets=L.sets||[];L.sets[+d.i]=L.sets[+d.i]||{};L.sets[+d.i][d.f]=el.value}
    save();refreshCard(d.k.split('|')[1]);return}
  if(d.c){const k=`w${S.ui.week}`,c=S.cardio[k]||(S.cardio[k]={});c[d.c]=el.type==='checkbox'?el.checked:el.value;save();renderHeader();return}
  if(d.note){S.dayNotes[d.note]=el.value;save();return}
  if(d.wk){const k=`w${S.ui.week}`,w=S.weeks[k]||(S.weeks[k]={});w[d.wk]=el.value;save();return}
  if(d.start){S.starts[d.start]=el.value;save();return}
});
document.addEventListener('change',ev=>{
  if(ev.target.id==='imp'){const f=ev.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d.logs!=='object')throw 0;S={...S,...d,ui:S.ui};save();render();toast('Backup restored')}catch(e){alert('That file is not a valid backup.')}};r.readAsText(f)}
  if(ev.target.dataset.c==='mob'){const k=`w${S.ui.week}`,c=S.cardio[k]||(S.cardio[k]={});c.mob=ev.target.checked;save()}
});
render();
</script>
</body>
</html>
